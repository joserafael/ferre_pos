services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: ferre_pos_app
    restart: unless-stopped
    volumes:
      - ./ferre_pos_api:/var/www/html/ferre_pos_api
    working_dir: /var/www/html/ferre_pos_api
    environment:
      CI_ENVIRONMENT: development
      # MySQL Database
      database.default.hostname: db
      database.default.port: 3306
      database.default.database: ${MYSQL_DATABASE:-ferre_pos_db}
      database.default.username: ${MYSQL_USER:-user}
      database.default.password: ${MYSQL_PASSWORD:-password}
      database.default.DBDriver: MySQLi
      # Redis (for CodeIgniter cache)
      cache.redis.host: redis
      cache.redis.password:
      cache.redis.port: 6379
      cache.redis.timeout: 0
      cache.redis.database: 0
      # Email (MailHog)
      email.fromEmail: 'app@example.com'
      email.fromName: 'ferre_pos'
      email.SMTPHost: mailhog
      email.SMTPPort: 1025
      email.SMTPUser: ''
      email.SMTPPass: ''
      email.protocol: smtp
      email.mailType: html
      email.charset: utf-8
      email.SMTPCrypto: ''
    depends_on:
      - db
      - redis
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: ferre_pos_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./ferre_pos_api:/var/www/html/ferre_pos_api
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ferre_pos_web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ./ferre_pos_web:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
    depends_on:
      - nginx
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: ferre_pos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ferre_pos_db}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_HOST_PORT:-33061}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: ferre_pos_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-63791}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  mailhog:
    image: mailhog/mailhog
    container_name: ferre_pos_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_network

  redis-commander:
    container_name: ferre_pos_redis_commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - app_network

volumes:
  mysql_data:
  redis_data:

networks:
  app_network:
    driver: bridge
